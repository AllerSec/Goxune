<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Goxune">
  <defs>
    <!-- userSpaceOnUse: an objectBoundingBox gradient cannot paint perfectly
         straight strokes (zero-area bbox), which made the wheat stalk invisible -->
    <linearGradient id="gx-ink" x1="0" y1="0" x2="320" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E08A4A"/>
      <stop offset="1" stop-color="#C46A2E"/>
    </linearGradient>
  </defs>
  <!-- wheat sprig mark -->
  <g transform="translate(10 14)" stroke="url(#gx-ink)" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M30 66 C30 44 30 30 30 14"/>
    <g stroke-width="3">
      <path d="M30 20 C22 14 16 16 14 10"/><path d="M30 20 C38 14 44 16 46 10"/>
      <path d="M30 32 C22 26 16 28 14 22"/><path d="M30 32 C38 26 44 28 46 22"/>
      <path d="M30 44 C22 38 16 40 14 34"/><path d="M30 44 C38 38 44 40 46 34"/>
    </g>
  </g>
  <!-- wordmark: Fraunces italic for the handwritten-sign feel -->
  <text x="74" y="66" font-family="Fraunces, Georgia, serif" font-size="56"
        font-style="italic" font-weight="600" fill="url(#gx-ink)" letter-spacing="-1">Goxune</text>
</svg>
